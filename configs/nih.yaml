# NIH ChestX-ray14-only config — run the REAL pipeline on real CXRs (dev loop + first numbers).
# Build the manifest first: python scripts/build_manifest_nih.py --csv data/raw/nih/Data_Entry_2017.csv
seed: 42

paths:
  raw: data/raw
  processed: data/processed_nih
  concepts: data/concepts
  embeddings: data/embeddings_nih
  results: experiments/results

data:
  dataset: NIH-ChestXray14
  manifest: data/raw/nih/labels.csv
  image_root: data/raw/nih/images
  frontal_only: true
  projections_keep: [PA, AP]
  id_col: image_id
  patient_col: patient_id
  projection_col: projection
  split_col: split
  image_size: 224
  num_workers: 8              # feed the GPU (8-12); set 0 on Windows only if spawn hangs
  prefetch_factor: 2          # batches prefetched per worker (host RAM ~= workers*prefetch*batch imgs)

splits:
  fractions: {train: 0.70, calib: 0.10, val: 0.10, test: 0.10}
  calib_from_train: true

concepts:
  bank: data/concepts/nih_concepts.yaml    # generated by build_manifest_nih.py (9 known + 6 unseen)
  prompt_ensemble: true
  negatives: true

model:
  encoder: biomedclip
  hf_id: hf-hub:microsoft/BiomedCLIP-PubMedBERT_256-vit_base_patch16_224
  embed_dim: 512
  freeze: true

calibrate:
  method: platt
  max_iter: 200

valve:
  abnormality_prompt: "no acute cardiopulmonary abnormality"
  use_vacuity: false

conformal:
  alpha_flag: 0.05
  alpha_risk: 0.10
  shift_robust: false

ood:
  baselines: [msp, jointenergy, mahalanobis, knn, mcm, neglabel, emptyset]
  knn_k: 50

eval:
  bootstrap: 1000
  fpr_at_tpr: 0.95
  seeds: [0, 1, 2]

compute:
  device: cuda
  amp: true                    # fp16 autocast
  pin_memory: true             # faster host->device copies
  batch_size: 512              # ViT-B/16@224 fp16 fits easily; lower if VRAM OOMs, raise to 1024 if free
