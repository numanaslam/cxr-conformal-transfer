# Second predictor: general-domain OpenAI CLIP ViT-B/16 (frozen), otherwise identical to iuxray_nihtax.yaml.
# IU X-ray, sensitivity run: abnormal studies without any NIH-taxonomy finding are dropped.
# Built by scripts/build_iuxray.py --nih-taxonomy-only --out data/raw/iuxray_nihtax/labels.csv.
seed: 42

paths:
  raw: data/raw
  processed: data/processed_iuxray_nihtax
  concepts: data/concepts
  embeddings: data/embeddings_iuxray_nihtax_clip
  results: experiments/results_clip

# where the NIH-trained artifacts live (shared predictor for the pilot)
cross_hospital:
  nih_processed: data/processed_nih_clip
  nih_embeddings: data/embeddings_nih_clip

data:
  dataset: IU-Xray
  manifest: data/raw/iuxray_nihtax/labels.csv         # build_iuxray.py --nih-taxonomy-only
  image_root: D:/data/iuxray/images_256             # 8-bit PNG, shorter side 256
  frontal_only: true
  projections_keep: [PA, AP]
  id_col: image_id
  patient_col: patient_id
  projection_col: projection
  split_col: split
  site_col: site
  image_size: 224
  num_workers: 0                    # Windows: spawn workers hung on this site; 3.6k images need no workers
  prefetch_factor: 2

splits:
  fractions: {train: 0.0, calib: 0.5, val: 0.0, test: 0.5}   # deploy set: split into calib/test
  calib_from_train: false

concepts:
  bank: data/concepts/nih_concepts.yaml       # SAME 9 known + 6 unseen as NIH
  prompt_ensemble: true
  negatives: true

model:
  encoder: clip
  hf_id: ViT-B-16::openai
  embed_dim: 512
  freeze: true

calibrate: {method: platt, max_iter: 200}
valve: {abnormality_prompt: "no acute cardiopulmonary abnormality", use_vacuity: false}
conformal: {alpha_flag: 0.05, alpha_risk: 0.10, shift_robust: false}
ood: {baselines: [msp, jointenergy, mahalanobis, knn, mcm, neglabel, emptyset], knn_k: 50}
eval: {bootstrap: 1000, fpr_at_tpr: 0.95, seeds: [0, 1, 2]}

compute:
  device: cuda
  amp: true
  pin_memory: true
  batch_size: 512
