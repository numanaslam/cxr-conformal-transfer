# OV-CBMR concept bank — REAL CXR-LT 2026 classes (from arXiv 2604.15555 overview).
# 30 seen (Task 1) + 6 unseen/OOD (Task 2). `display` = phrase inserted into prompt templates.
# NOTE: `name` must match the label CSV column names exactly — confirm against the downloaded
# CXR-LT label file (paste the header) and adjust casing/spacing if the release differs.

