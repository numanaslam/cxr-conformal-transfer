  - {name: Bronchiectasis,              display: bronchiectasis}
  - {name: Cardiomegaly,                display: cardiomegaly}
  - {name: Calcified Densities,         display: calcified densities}
  - {name: Central Venous Catheter,     display: a central venous catheter}
  - {name: Emphysema,                   display: emphysema}
  - {name: Fracture,                    display: a fracture}
  - {name: Hemidiaphragm Elevation,     display: hemidiaphragm elevation}
  - {name: Hernia,                      display: a hiatal hernia}
  - {name: Hydropneumothorax,           display: a hydropneumothorax}
